name: Build and Push Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: transaksikilat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      # The suite refuses to run against a database whose name does not end in
      # _test, because every run truncates tables.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/transaksikilat_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's base image.
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run verify

  build-and-push:
    # No image reaches the registry unless the suite passes.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/akbarryyan/transaksikilat:latest
            ghcr.io/akbarryyan/transaksikilat:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_AUTH_OTP_ENABLED=${{ vars.NEXT_PUBLIC_AUTH_OTP_ENABLED }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_REQUIRE_LOGIN_TO_PURCHASE=${{ vars.NEXT_PUBLIC_REQUIRE_LOGIN_TO_PURCHASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
