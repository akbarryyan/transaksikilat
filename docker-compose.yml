services:
  transaksikilat-app:
    image: ghcr.io/akbarryyan/transaksikilat:latest
    container_name: transaksikilat-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
      LOG_DIR: /app/logs
    volumes:
      - /var/www/transaksikilat/public/uploads:/app/public/uploads
      - /var/www/transaksikilat/logs:/app/logs
    # Without a cap the json-file driver grows stdout logs without limit; the
    # app mirrors every console line to stdout as well as to app.log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
